plugins {
    id 'com.android.application'
}

android {
    namespace 'org.franka.questteleop'
    compileSdk 34
    ndkVersion '26.3.11579264'

    def questBridgePort = providers.gradleProperty('questBridgePort').orElse('45454').get()

    defaultConfig {
        applicationId 'org.franka.questteleop'
        minSdk 29
        targetSdk 32
        versionCode 1
        versionName '0.1.0'
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -Wall -Wextra -Werror'
                arguments '-DANDROID_STL=c++_shared', "-DQUEST_BRIDGE_PORT=${questBridgePort}"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}
