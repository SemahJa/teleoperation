# One entry per physical robot. Keep arm namespaces and FCI addresses unique.
# Standalone mapping default: one arm assigned to the Quest right controller.
arms:
  panda_1:
    robot_ip: ""
    namespace: "/panda_1"
    base_frame: "panda_1/panda_link0"
    controller: "right"
    # Mapping-only guards. Combined bringup selects hardware separately.
    controller_enabled: false
    operator_confirm: false
    command_topic: "cartesian_teleop_command"
    target_pose_topic: "target_pose"
    measured_pose_topic: "teleop_anchor_pose"
    state_topic: "robot_state"
    # Quaternion rotates Quest LOCAL vectors into this arm's robot base frame.
    reference_to_robot_xyzw: [0.0, 0.0, 0.0, 1.0]
    translation_scale: 1.0
    rotation_scale: 1.0
    feedforward_scale: 1.0
    # Placeholder; choose and verify commissioning values before hardware use.
    twist_filter_cutoff_hz: 10.0
    # Independent mapped pose and velocity processing (none, low_pass, four_pole).
    pose_filter: none
    velocity_filter: low_pass
    pose_filter_cutoff_hz: 10.0
    velocity_filter_cutoff_hz: 10.0
    # Interpolation: none, ptp_polynomial (septic), spline (quintic).
    pose_interpolation: none
    velocity_interpolation: none
    pose_interpolation_duration_ms: 40.0
    velocity_interpolation_duration_ms: 40.0
    command_timeout_ms: 100
