# Topic profile; teleop_bringup controls whether recording is launched.
# Derive controller input, mapped command, measured pose and tracking topics
# per arm. Other topics can be added explicitly below.
include_default_topics: true
# Add custom topics here. Set include_default_topics:false to replace the profile.
topics: []
# Absolute path inside the existing ROS container, mounted through /ws.
output_root: /ws/log/quest_bags
storage_id: sqlite3
